<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#17100b" />
<title>銭湯からの脱出 | COPA GAMES</title>
<style>
:root{--cream:#f7ecd5;--wood:#3d2415;--gold:#d8aa65;--ink:#21150e;--panel:rgba(20,14,11,.91)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090706;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#fff}
button{font:inherit}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#0b0806;touch-action:manipulation;user-select:none}
@media (min-width:600px){#app{width:min(393px,100vw);height:min(852px,100dvh);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 70px #000;border-radius:18px}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:opacity .28s ease;pointer-events:none}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08),transparent 55%,rgba(0,0,0,.28));pointer-events:none}
#sceneTitle{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);font-size:12px;letter-spacing:.08em;z-index:10;display:none}
.hotspot{position:absolute;border:0;background:transparent;z-index:8;cursor:pointer;border-radius:14px}
#app.show-hints .hotspot{outline:2px solid rgba(121,210,255,.9);background:rgba(90,180,255,.12);box-shadow:0 0 18px rgba(90,180,255,.75)}
.navbtn{position:absolute;z-index:12;bottom:calc(env(safe-area-inset-bottom) + 12px);width:64px;height:48px;border:1px solid rgba(255,255,255,.32);border-radius:13px;color:#fff;background:linear-gradient(#49301fdd,#281911ee);box-shadow:0 4px 12px #0008;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#backBtn{left:10px}#bagBtn{left:50%;transform:translateX(-50%)}#hintBtn{right:10px}
#dialog{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);min-height:88px;z-index:30;background:linear-gradient(180deg,rgba(24,18,15,.95),rgba(8,7,6,.95));border:1px solid rgba(255,255,255,.38);border-radius:15px;padding:15px 16px 24px;box-shadow:0 8px 28px #000b;display:none;line-height:1.7;font-size:15px}
#dialog.open{display:block;animation:pop .18s ease-out}
#dialog:after{content:"▼";position:absolute;right:14px;bottom:5px;color:#d7b27d;font-size:12px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.overlay{position:absolute;inset:0;z-index:50;background:rgba(5,4,3,.74);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.card{width:100%;max-height:82%;overflow:auto;background:linear-gradient(180deg,#f7ecd8,#ddc59b);color:#24170e;border:4px solid #4b2b18;border-radius:18px;box-shadow:0 14px 50px #000d;padding:16px;-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 12px;text-align:center;font-family:serif}.card p{line-height:1.6;font-size:14px}.card button{min-height:44px;border:2px solid #6d4728;border-radius:10px;background:#f8eedb;color:#25160d;font-weight:700;padding:8px 12px}.card .primary{background:#5a3520;color:#fff5df}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.sep{height:1px;background:#9d7a51;margin:12px 0}
.item{display:flex;gap:10px;align-items:center;background:#fff8e8;border:1px solid #a9845b;border-radius:12px;padding:10px;margin:8px 0}.item .ico{font-size:26px;width:36px;text-align:center}.small{font-size:12px;color:#765f4b}.ok{color:#17621e;font-weight:800}.warn{color:#842d22;font-weight:800}.choice.active{background:#5a3520;color:white;box-shadow:0 0 0 3px #e7b65d inset}.seq{display:flex;justify-content:center;gap:5px;min-height:32px;margin:8px 0}.seq span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#5a3520;color:#fff;font-weight:800}
#titleLayer{position:absolute;inset:0;z-index:70}.titleHot{position:absolute;left:20%;width:60%;height:7%;border:0;background:transparent;border-radius:8px}.titleHot:focus{outline:2px solid #f7d290}.titleNew{top:66.7%}.titleContinue{top:74.4%}.titleContinue.disabled{pointer-events:none;opacity:.18;background:rgba(0,0,0,.55)}
#fade{position:absolute;inset:0;background:#000;z-index:90;pointer-events:none;opacity:0;transition:opacity .55s ease}.fadein{opacity:1!important}
#toast{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:50%;transform:translateX(-50%);z-index:80;background:rgba(20,13,9,.93);border:1px solid #d0a36a;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.showtoast{opacity:1!important}
#endingBtn{position:absolute;z-index:75;left:20%;right:20%;bottom:8%;height:52px;border-radius:14px;border:1px solid #f1cc8e;background:rgba(39,22,13,.9);color:#fff3db;font-weight:800;display:none}
</style>
</head>
<body>
<div id="app">
  <img id="bg" class="bg" alt="ゲーム背景" />
  <div class="shade"></div>
  <div id="sceneTitle"></div>
  <div id="hotspots"></div>
  <button id="backBtn" class="navbtn" type="button">← 戻る</button>
  <button id="bagBtn" class="navbtn" type="button">持ち物</button>
  <button id="hintBtn" class="navbtn" type="button">ヒント</button>
  <div id="dialog"></div>
  <div id="titleLayer"><button class="titleHot titleNew" aria-label="はじめから"></button><button class="titleHot titleContinue" aria-label="つづきから"></button></div>
  <div id="overlay" class="overlay"><div class="card" id="overlayCard"></div></div>
  <button id="endingBtn" type="button">タイトルへ戻る</button>
  <div id="toast"></div>
  <div id="fade"></div>
</div>
<script>
(()=>{
const A='';
const imgs={
 title:'銭湯からの脱出_夜の番台.png',hub:'夜の銭湯_静かな脱衣所.png',locker:'湯屋の木製ロッカー14番.png',
 entrance:'夕暮れの銭湯玄関と下足箱.png',counterFront:'夜の銭湯番台と静かな入口.png',counter:'銭湯の番台裏と従業員専用通路.png',
 keys:'銭湯の脱衣鍵返却所.png',bath:'富士山銭湯の四つの湯槽.png',bathDetail:'銭湯の浴槽設定案内板.png',
 sauna:'静寂の和風サウナ_интерьер.png',saunaDetail:'木製サウナの温もりとタイマー.png',rest:'夜の銭湯休憩室と牛乳瓶棚.png',restDetail:'湯上がり牛乳びん返却所.png',
 panel:'銭湯の閉店点検表.png',route:'銭湯の閉店巡回図.png',evac:'銭湯ロビーの避難経路図.png',corridor:'銭湯の静かな裏通路.png',backdoor:'銭湯裏口の夜道.png',openDoor:'夜の銭湯裏口とつながったスマホ.png',end:'銭湯の脱出成功_月夜の帰り道.png'};
const fresh=()=>({scene:'hub',history:[],inventory:['ロッカーキー14'],lockerOpened:false,shoehorn:false,gateOpen:false,counterSeen:false,clues:{locker:false,bath:false,sauna:false,rest:false},panel:{locker:0,bath:'water',sauna:'up',rest:'white',verified:false,opened:false,seq:[]},backdoorKey:false,escaped:false});
let s=fresh(),dialogQueue=[],dialogResolve=null;
const $=q=>document.querySelector(q),bg=$('#bg'),hot=$('#hotspots'),app=$('#app'),overlay=$('#overlay'),card=$('#overlayCard'),dialog=$('#dialog'),fade=$('#fade'),titleLayer=$('#titleLayer'),sceneTitle=$('#sceneTitle'),endingBtn=$('#endingBtn');
function save(){localStorage.setItem('copa_sento_save',JSON.stringify(s)); updateContinue()}
function load(){try{let d=JSON.parse(localStorage.getItem('copa_sento_save'));if(d)s=d}catch{} }
function updateContinue(){const b=$('.titleContinue');b.classList.toggle('disabled',!localStorage.getItem('copa_sento_save'))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('showtoast');setTimeout(()=>e.classList.remove('showtoast'),1400)}
function setBg(name){bg.src=A+imgs[name]}
function hs(x,y,w,h,fn,label='調べる'){let b=document.createElement('button');b.type='button';b.className='hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',label);b.addEventListener('click',fn);hot.appendChild(b)}
function say(...lines){return new Promise(res=>{dialogQueue=[...lines];dialogResolve=res;nextDialog()})}
function nextDialog(){if(!dialogQueue.length){dialog.classList.remove('open');let r=dialogResolve;dialogResolve=null;if(r)r();return}dialog.textContent=dialogQueue.shift();dialog.classList.add('open')}
dialog.addEventListener('click',nextDialog);
function closeOverlay(){overlay.classList.remove('open');card.innerHTML=''}
function openOverlay(html,init){card.innerHTML=html;overlay.classList.add('open'); if(init)init()}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay()});
function addItem(name){if(!s.inventory.includes(name)){s.inventory.push(name);toast(`${name} を手に入れた`);save()}}
function go(name,push=true){if(push && s.scene && s.scene!==name)s.history.push(s.scene);s.scene=name;save();render()}
function back(){if(dialog.classList.contains('open')){nextDialog();return} if(overlay.classList.contains('open')){closeOverlay();return}let p=s.history.pop();if(p){s.scene=p;save();render()}else if(s.scene!=='hub')go('hub',false)}
function details(title,img,text,after){openOverlay(`<h2>${title}</h2><img src="${A+img}" alt="${title}" style="width:100%;border-radius:10px;display:block"><p>${text||''}</p><div class="row"><button class="primary" id="closeDetail">戻る</button></div>`,()=>{$('#closeDetail').onclick=()=>{closeOverlay();if(after)after()}})}
function inventory(){openOverlay(`<h2>持ち物</h2>${s.inventory.map(n=>`<div class="item"><div class="ico">${({'ロッカーキー14':'🔑','靴箱の鍵':'🗝️','スマホ':'📱','財布':'👛','靴べら':'🥄','裏口の鍵':'🔑'})[n]||'•'}</div><div><b>${n}</b><div class="small">${n==='スマホ'?'電源が入らない。':n==='靴べら'?'細長くて丈夫そうだ。':''}</div></div></div>`).join('')}<div class="row"><button id="closeBag" class="primary">閉じる</button></div>`,()=>$('#closeBag').onclick=closeOverlay)}
function hint(){const h={hub:'まず腕のロッカーキーと、14番ロッカーを確認しましょう。',locker:'ロッカーの中身を回収しましょう。',entrance:'番台の小扉は向こう側から掛かっています。細長い物が使えそうです。',counter:'点検盤を開くには、脱衣所・浴場・サウナ・休憩所の情報が必要です。',bath:'「設定温度」と「現在温度」の差を比べます。',sauna:'利用案内の「6分」を12分計の位置に置き換えます。',rest:'返却瓶の本数が最も少ない種類を見ます。',corridor:'裏口の鍵を持っているなら、扉を調べましょう。'}[s.scene]||'気になる場所をもう一度調べてみましょう。';say(h);app.classList.toggle('show-hints');setTimeout(()=>app.classList.remove('show-hints'),3000)}
function render(){hot.innerHTML='';endingBtn.style.display='none';$('#backBtn').style.display=s.scene==='title'?'none':'flex';$('#bagBtn').style.display=s.scene==='title'?'none':'flex';$('#hintBtn').style.display=s.scene==='title'?'none':'flex';sceneTitle.style.display=s.scene==='title'?'none':'block';
 const R=scenes[s.scene]||scenes.hub;setBg(R.bg);sceneTitle.textContent=R.title||'';R.hotspots?.();}
const scenes={
 title:{bg:'title',title:'',hotspots:()=>{}},
 hub:{bg:'hub',title:'脱衣所',hotspots:()=>{
  hs(0,8,31,55,()=>go('locker'), 'ロッカー'); hs(29,20,25,28,()=>go('bath'),'浴場'); hs(59,20,30,34,()=>go('rest'),'休憩所'); hs(40,22,25,30,()=>go('entrance'),'番台・入口'); hs(61,5,24,15,()=>say('壁時計だ。','……さっきから針が動いていないような気がする。'),'時計');
 }},
 locker:{bg:'locker',title:'ロッカー14',hotspots:()=>{hs(6,18,88,55,async()=>{if(!s.lockerOpened){s.lockerOpened=true;addItem('靴箱の鍵');addItem('スマホ');addItem('財布');await say('14番ロッカーを開けた。','服と財布、スマホ、靴箱の鍵が入っている。','スマホは……電源が入らない。')}else say('必要な物は回収した。')} ,'ロッカーの中');}},
 entrance:{bg:'entrance',title:'入口・下足箱',hotspots:()=>{
  hs(0,7,52,64,async()=>{if(!s.shoehorn){s.shoehorn=true;addItem('靴べら');await say('長い木製の靴べらだ。','何かに届かせるには使えそうだ。')}else say('下足箱だ。')} ,'下足箱');
  hs(55,25,40,48,async()=>{if(!s.gateOpen){if(s.shoehorn){s.gateOpen=true;save();await say('番台の小扉の隙間から靴べらを差し込む。','……カチャン。','掛け金が外れた。');go('counter')}else await say('番台の小扉は向こう側から掛かっている。','指では届かない。細長い物なら……。')}else go('counter')},'番台の小扉');
 }},
 counter:{bg:'counter',title:'番台の内側',hotspots:()=>{
  hs(4,18,39,39,()=>keyPuzzle(),'ロッカーキー返却所'); hs(40,23,34,38,()=>panelPuzzle(),'閉店点検盤'); hs(68,10,30,32,()=>details('避難経路図',imgs.evac,'番台の奥から従業員通路を通り、裏口へ出られるようだ。'),'避難経路図'); hs(69,47,28,22,()=>details('閉店巡回図',imgs.route,'巡回順は「浴場 → サウナ → 脱衣所 → 休憩所」。'),'閉店巡回図'); hs(58,55,38,33,async()=>{if(s.backdoorKey){await say('従業員通路へ進めそうだ。');go('corridor')}else say('従業員用の通路だ。','今は先へ進めない。')} ,'従業員通路');
 }},
 bath:{bg:'bath',title:'浴場',hotspots:()=>{hs(14,27,72,45,()=>bathPuzzle(),'浴槽');hs(4,5,92,22,()=>details('浴槽設定状況',imgs.bathDetail,'設定と現在の温度差を比べてみよう。',()=>{}),'温度案内');hs(68,0,30,15,()=>go('sauna'),'サウナへ');}},
 sauna:{bg:'sauna',title:'サウナ',hotspots:()=>{hs(53,5,42,35,()=>saunaPuzzle(),'12分計');hs(15,7,36,33,()=>details('サウナ利用案内',imgs.saunaDetail,'「1回6分程度」が目安らしい。'),'利用案内');}},
 rest:{bg:'rest',title:'休憩所',hotspots:()=>{hs(0,22,38,46,()=>restPuzzle(),'牛乳びん返却口');hs(54,10,40,58,()=>restPuzzle(),'返却瓶');}},
 corridor:{bg:'backdoor',title:'従業員通路・裏口',hotspots:()=>{hs(27,16,49,55,async()=>{if(!s.backdoorKey){await say('裏口だ。鍵がかかっている。');return}await say('裏口の鍵を差し込む。','……ガチャ。');setBg('openDoor');await new Promise(r=>setTimeout(r,700));await say('外の音が戻ってきた。','スマホの電源も……普通についた。','……なんだったんだ？');s.escaped=true;save();s.scene='end';render()},'裏口');}},
 end:{bg:'end',title:'',hotspots:()=>{endingBtn.style.display='block';sceneTitle.style.display='none';$('#backBtn').style.display=$('#bagBtn').style.display=$('#hintBtn').style.display='none';}}
};
async function keyPuzzle(){details('脱衣鍵返却所',imgs.keys,'返却されていない鍵は 08・14・23・31。14は自分が持っている。',()=>{openOverlay(`<h2>脱衣所の点検</h2><p>返却ボードと脱衣所の状態を照合する。<br>08と31はロッカー側に鍵があり、14は自分が使用中。では、説明がつかない番号は？</p><div class="grid2"><button data-v="8">08</button><button data-v="23">23</button><button data-v="31">31</button><button data-v="14">14</button></div><div class="sep"></div><button id="kc" class="primary">戻る</button>`,()=>{card.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{if(+b.dataset.v===23){s.clues.locker=true;s.panel.locker=23;save();closeOverlay();await say('23番だけ状況が合わない。','脱衣所の確認値は「23」だ。')}else toast('その番号ではなさそうだ')});$('#kc').onclick=closeOverlay})})}
function bathPuzzle(){details('浴槽設定状況',imgs.bathDetail,'水風呂 18→17、炭酸泉 38→38、薬湯 40→39、主浴槽 41→43。',()=>{openOverlay(`<h2>浴場の点検</h2><p>「設定温度との差が最も大きい浴槽」を選びます。</p><div class="grid2"><button data-b="water">水風呂</button><button data-b="carbon">炭酸泉</button><button data-b="herb">薬湯</button><button data-b="main">主浴槽</button></div><div class="sep"></div><button id="bc" class="primary">戻る</button>`,()=>{card.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{if(b.dataset.b==='main'){s.clues.bath=true;s.panel.bath='main';save();closeOverlay();await say('差が最大なのは主浴槽。','浴場の確認は「主浴槽」だ。')}else toast('温度差をもう一度比べよう')});$('#bc').onclick=closeOverlay})})}
function saunaPuzzle(){details('12分計',imgs.saunaDetail,'目安は「1回6分程度」。12分計で6分の位置は……。',()=>{openOverlay(`<h2>サウナの点検</h2><p>6分の位置を方向で選びます。</p><div class="grid2"><button data-s="up">↑ 上</button><button data-s="right">→ 右</button><button data-s="down">↓ 下</button><button data-s="left">← 左</button></div><div class="sep"></div><button id="sc" class="primary">戻る</button>`,()=>{card.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{if(b.dataset.s==='down'){s.clues.sauna=true;s.panel.sauna='down';save();closeOverlay();await say('12分計の6分は真下。','サウナの確認は「↓」だ。')}else toast('12分計の6分の位置を考えよう')});$('#sc').onclick=closeOverlay})})}
function restPuzzle(){details('牛乳びん返却口',imgs.restDetail,'白4本、茶2本、黄3本、桃5本。',()=>{openOverlay(`<h2>休憩所の点検</h2><p>最も少ない種類のふたの色を選びます。</p><div class="grid2"><button data-r="white">白</button><button data-r="brown">茶</button><button data-r="yellow">黄</button><button data-r="pink">桃</button></div><div class="sep"></div><button id="rc" class="primary">戻る</button>`,()=>{card.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(b.dataset.r==='brown'){s.clues.rest=true;s.panel.rest='brown';save();closeOverlay();await say('一番少ないのはコーヒー牛乳の2本。','休憩所の確認色は「茶」だ。')}else toast('本数を数え直そう')});$('#rc').onclick=closeOverlay})})}
function panelPuzzle(){const bathLabel={water:'水',carbon:'炭',herb:'薬',main:'主'}[s.panel.bath], saunaLabel={up:'↑',right:'→',down:'↓',left:'←'}[s.panel.sauna], restLabel={white:'白',brown:'茶',yellow:'黄',pink:'桃'}[s.panel.rest];
 openOverlay(`<h2>閉店点検盤</h2><p>各エリアで確認した情報を入力する。</p>
 <div class="item"><div class="ico">🧺</div><div><b>脱衣所</b><div class="small">現在値：${String(s.panel.locker).padStart(2,'0')}</div></div><button id="lockerSet">変更</button></div>
 <div class="item"><div class="ico">♨️</div><div><b>浴場</b><div class="small">現在値：${bathLabel}</div></div><button id="bathSet">変更</button></div>
 <div class="item"><div class="ico">🧖</div><div><b>サウナ</b><div class="small">現在値：${saunaLabel}</div></div><button id="saunaSet">変更</button></div>
 <div class="item"><div class="ico">🥛</div><div><b>休憩所</b><div class="small">現在値：${restLabel}</div></div><button id="restSet">変更</button></div>
 <div class="sep"></div><div class="row"><button id="verify" class="primary">閉店確認</button><button id="panelClose">戻る</button></div><div id="panelMsg"></div>`,()=>{
  $('#lockerSet').onclick=()=>numberPicker();$('#bathSet').onclick=()=>pick('浴場',['water','carbon','herb','main'],['水風呂','炭酸泉','薬湯','主浴槽'],'bath');$('#saunaSet').onclick=()=>pick('サウナ',['up','right','down','left'],['↑','→','↓','←'],'sauna');$('#restSet').onclick=()=>pick('休憩所',['white','brown','yellow','pink'],['白','茶','黄','桃'],'rest');$('#panelClose').onclick=closeOverlay;$('#verify').onclick=verifyPanel;
 })}
function numberPicker(){openOverlay(`<h2>脱衣所</h2><p>番号を入力</p><div class="row"><button id="minus">−</button><div style="font-size:34px;font-weight:900;min-width:65px;text-align:center" id="num">${String(s.panel.locker).padStart(2,'0')}</div><button id="plus">＋</button></div><div class="sep"></div><div class="row"><button id="numok" class="primary">決定</button><button id="numback">戻る</button></div>`,()=>{let n=s.panel.locker;const u=()=>$('#num').textContent=String(n).padStart(2,'0');$('#minus').onclick=()=>{n=(n+39)%40;u()};$('#plus').onclick=()=>{n=(n+1)%40;u()};$('#numok').onclick=()=>{s.panel.locker=n;save();closeOverlay();panelPuzzle()};$('#numback').onclick=()=>{closeOverlay();panelPuzzle()}})}
function pick(title,vals,labels,key){openOverlay(`<h2>${title}</h2><div class="grid2">${vals.map((v,i)=>`<button data-p="${v}">${labels[i]}</button>`).join('')}</div><div class="sep"></div><button id="pickback" class="primary">戻る</button>`,()=>{card.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.panel[key]=b.dataset.p;save();closeOverlay();panelPuzzle()});$('#pickback').onclick=()=>{closeOverlay();panelPuzzle()}})}
function verifyPanel(){const ok=s.panel.locker===23&&s.panel.bath==='main'&&s.panel.sauna==='down'&&s.panel.rest==='brown';if(!ok){$('#panelMsg').innerHTML='<p class="warn">どこかの入力が違うようだ。</p>';return} s.panel.verified=true;save();routeSequence()}
function routeSequence(){openOverlay(`<h2>巡回順を確認</h2><p>入力値は合っている。最後に、閉店巡回図の順番で4エリアを押してください。</p><div class="seq" id="seq"></div><div class="grid2"><button data-q="bath">浴場</button><button data-q="sauna">サウナ</button><button data-q="locker">脱衣所</button><button data-q="rest">休憩所</button></div><div class="sep"></div><button id="routeView">巡回図を見る</button><button id="routeBack">戻る</button>`,()=>{let seq=[];const target=['bath','sauna','locker','rest'],lab={bath:'浴',sauna:'サ',locker:'脱',rest:'休'};const draw=()=>$('#seq').innerHTML=seq.map(x=>`<span>${lab[x]}</span>`).join('');card.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{seq.push(b.dataset.q);draw();let i=seq.length-1;if(seq[i]!==target[i]){seq=[];draw();toast('順番が違うようだ');return}if(seq.length===4){s.panel.opened=true;s.backdoorKey=true;addItem('裏口の鍵');save();closeOverlay();await say('カチ……カチ……ガコン。','点検盤の下部が開いた。','「裏口」と書かれた鍵を手に入れた。')}});$('#routeView').onclick=()=>details('閉店巡回図',imgs.route,'浴場 → サウナ → 脱衣所 → 休憩所',()=>routeSequence());$('#routeBack').onclick=()=>{closeOverlay();panelPuzzle()}})}
async function newGame(){s=fresh();localStorage.removeItem('copa_sento_save');save();titleLayer.style.display='none';s.scene='hub';render();fade.classList.add('fadein');setTimeout(async()=>{fade.classList.remove('fadein');await say('……ちょっと入りすぎたな。','少し休んでから帰ろう……。','……。','……ん？','誰もいない……？');},500)}
function continueGame(){load();titleLayer.style.display='none';if(s.scene==='title')s.scene='hub';render();toast('つづきから再開しました')}
function showTitle(){s.scene='title';titleLayer.style.display='block';setBg('title');hot.innerHTML='';sceneTitle.style.display='none';$('#backBtn').style.display=$('#bagBtn').style.display=$('#hintBtn').style.display='none';endingBtn.style.display='none';updateContinue()}
$('.titleNew').onclick=newGame;$('.titleContinue').onclick=()=>{if(localStorage.getItem('copa_sento_save'))continueGame()};$('#backBtn').onclick=back;$('#bagBtn').onclick=inventory;$('#hintBtn').onclick=hint;endingBtn.onclick=()=>{localStorage.removeItem('copa_sento_save');s=fresh();showTitle()};
updateContinue();showTitle();
})();
</script>
