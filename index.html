<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#120c08" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>銭湯からの脱出 | COPA GAMES</title>
<style>
:root{
  --cream:#f4e5c7;--paper:#ead4aa;--wood:#3a2113;--wood2:#24150e;--gold:#d4a65e;
  --ink:#21150e;--red:#8e2d24;--green:#60865c;--glass:rgba(20,13,9,.80);
  --safeTop:env(safe-area-inset-top,0px);--safeBottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060403;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
body{position:fixed;inset:0;overscroll-behavior:none}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#090604;user-select:none;isolation:isolate}
@media (min-width:600px){#app{width:min(393px,100vw);height:min(852px,100dvh);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 80px #000;border-radius:20px}}

/* scene */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;transform:scale(1.002);filter:saturate(.96) contrast(1.02)}
#sceneFx{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at 50% 44%,transparent 38%,rgba(0,0,0,.20) 78%,rgba(0,0,0,.45) 100%)}
#sceneTitle{position:absolute;z-index:14;top:calc(var(--safeTop) + 10px);left:50%;transform:translateX(-50%);padding:6px 15px 7px;border:1px solid rgba(224,188,129,.36);border-radius:999px;background:linear-gradient(180deg,rgba(54,34,21,.78),rgba(25,15,10,.84));box-shadow:0 5px 18px #0008;color:#f5e7ce;font-family:serif;font-weight:700;font-size:12px;letter-spacing:.12em;backdrop-filter:blur(6px);white-space:nowrap}
#hotspots{position:absolute;inset:0;z-index:8}
.hotspot{position:absolute;background:transparent;border-radius:18px}
.hotspot:active{background:rgba(255,218,151,.06)}
.hotspot .spark{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,224,169,.93);box-shadow:0 0 0 0 rgba(255,216,144,.55),0 0 12px rgba(255,208,123,.9);opacity:0;pointer-events:none}
#app.scene-pulse .hotspot .spark{animation:sceneSpark 1.65s ease-out 1}
#app.show-hints .hotspot{outline:2px solid rgba(255,213,137,.78);background:rgba(255,196,99,.08);box-shadow:inset 0 0 28px rgba(255,186,77,.10)}
#app.show-hints .hotspot .spark{opacity:1;animation:hintSpark 1s ease-in-out infinite}
@keyframes sceneSpark{0%,22%{opacity:0;box-shadow:0 0 0 0 rgba(255,216,144,.5),0 0 10px rgba(255,208,123,.7)}45%{opacity:.68;box-shadow:0 0 0 9px rgba(255,216,144,.12),0 0 15px rgba(255,208,123,.85)}80%,100%{opacity:0;box-shadow:0 0 0 18px rgba(255,216,144,0),0 0 4px rgba(255,208,123,0)}}
@keyframes hintSpark{50%{transform:translate(-50%,-50%) scale(1.45);box-shadow:0 0 0 8px rgba(255,216,144,.12),0 0 18px rgba(255,208,123,1)}}

/* bottom dock */
#dock{position:absolute;z-index:22;left:50%;bottom:calc(var(--safeBottom) + 9px);transform:translateX(-50%);height:51px;padding:5px;display:flex;gap:5px;border:1px solid rgba(238,207,159,.24);border-radius:18px;background:linear-gradient(180deg,rgba(35,22,15,.84),rgba(15,10,7,.90));box-shadow:0 7px 24px #0009;backdrop-filter:blur(10px)}
.navbtn{position:relative;width:62px;height:40px;border-radius:13px;color:#f2e4cc;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px;font-weight:700;line-height:1.05}
.navbtn .ni{font-size:17px;line-height:18px;font-weight:400}
.navbtn:active{background:rgba(230,190,128,.14);transform:scale(.96)}
#hintBtn.attn{animation:hintNudge 2.6s ease-in-out 1}
@keyframes hintNudge{45%,60%{box-shadow:inset 0 0 0 1px rgba(255,213,143,.5);background:rgba(220,173,101,.11)}}

/* dialogue */
#dialog{position:absolute;left:13px;right:13px;bottom:calc(var(--safeBottom) + 68px);min-height:94px;z-index:36;padding:15px 17px 25px;border:1px solid rgba(238,211,166,.34);border-radius:16px;background:linear-gradient(180deg,rgba(28,18,12,.95),rgba(8,6,5,.97));box-shadow:0 12px 32px #000b;backdrop-filter:blur(8px);display:none;color:#f8efe1;font-size:15px;line-height:1.72;letter-spacing:.02em}
#dialog.open{display:block;animation:dialogIn .16s ease-out}
#dialog:after{content:"▼";position:absolute;right:15px;bottom:5px;color:#d3a660;font-size:11px;animation:blink 1.05s ease-in-out infinite}
@keyframes dialogIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}

/* overlays - deliberately no scrolling */
.overlay{position:absolute;inset:0;z-index:52;display:none;align-items:center;justify-content:center;padding:calc(var(--safeTop) + 14px) 13px calc(var(--safeBottom) + 14px);background:rgba(5,3,2,.78);backdrop-filter:blur(7px)}
.overlay.open{display:flex;animation:overlayIn .15s ease-out}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.card{position:relative;width:100%;max-width:370px;max-height:100%;overflow:hidden;color:var(--ink);border:2px solid #6d482b;border-radius:18px;background:linear-gradient(180deg,#f4e7cf 0%,#e2c79a 100%);box-shadow:0 16px 50px #000e, inset 0 0 0 2px rgba(255,255,255,.25);padding:17px}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(78,45,22,.08) 19px 20px)}
.card>*{position:relative}
.card h2{margin:0 0 8px;text-align:center;font-family:serif;font-size:21px;letter-spacing:.06em}
.card p{margin:7px 0 11px;font-size:13px;line-height:1.55}
.card button{min-height:42px;border:1px solid #765334;border-radius:11px;background:linear-gradient(#fff7e8,#ebd6b2);color:#2b1a10;font-weight:800;padding:7px 10px;box-shadow:0 2px 0 rgba(71,39,20,.22)}
.card button:active{transform:translateY(1px);box-shadow:none;background:#ddc095}
.card .primary{background:linear-gradient(#68432a,#3d2618);color:#fff2da;border-color:#2b180d}
.card .danger{background:#814139;color:#fff}
.closeX{position:absolute!important;z-index:4;right:8px;top:8px;width:36px;height:36px;min-height:36px!important;padding:0!important;border-radius:50%!important;background:rgba(32,20,13,.82)!important;color:#fff!important;border:1px solid rgba(255,255,255,.2)!important;box-shadow:none!important}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sep{height:1px;background:rgba(93,59,33,.34);margin:10px 0}
.small{font-size:11px;color:#715a45}.ok{color:#376d39;font-weight:900}.warn{color:#8c2f28;font-weight:900}

/* inspect image view */
.inspectCard{height:min(92%,760px);padding:10px;display:grid;grid-template-rows:1fr auto auto;gap:8px;background:#160e09;border-color:#6b4a2d;color:#f6ead6}
.inspectMedia{min-height:0;display:flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:#090604;box-shadow:inset 0 0 24px #000}
.inspectMedia img{width:100%;height:100%;object-fit:contain;display:block}
.inspectText{min-height:50px;padding:7px 9px;border-radius:10px;background:rgba(238,217,181,.10);border:1px solid rgba(238,217,181,.16);font-size:13px;line-height:1.5;color:#f6ead6}
.inspectActions{display:flex;justify-content:center}.inspectActions button{width:46%;background:linear-gradient(#5f3d27,#352116);color:#fff0d7;border-color:#8b6846}

/* inventory */
.invGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.invItem{min-height:78px;border:1px solid rgba(105,74,44,.45);border-radius:13px;background:rgba(255,249,235,.64);padding:9px;display:flex;gap:8px;align-items:center}
.invIcon{font-size:24px;width:31px;text-align:center}.invName{font-size:12px;font-weight:900}.invDesc{font-size:10px;color:#735d49;margin-top:3px;line-height:1.35}

/* inspection panel */
.panelCard{background:linear-gradient(180deg,#2b221b,#14100d);border:3px solid #80654b;color:#efe0c8;padding:14px;box-shadow:0 17px 50px #000,inset 0 0 0 1px #aa8962}
.panelHeader{font-family:serif;text-align:center;letter-spacing:.14em;font-weight:900;font-size:20px;margin:2px 0 4px}.panelSub{text-align:center;font-size:10px;color:#bca88e;margin-bottom:9px}
.panelRows{display:grid;gap:7px}.panelRow{display:grid;grid-template-columns:28px 1fr 58px;align-items:center;gap:7px;min-height:57px;padding:7px;border:1px solid #5a4939;border-radius:9px;background:linear-gradient(180deg,#26201a,#191511);box-shadow:inset 0 1px #ffffff0c}
.lamp{width:12px;height:12px;border-radius:50%;justify-self:center;background:#4c433b;box-shadow:inset 0 0 4px #000}.lamp.on{background:#86aa70;box-shadow:0 0 10px rgba(135,181,105,.65),inset 0 0 3px #eaffd9}.panelValue{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#ffe1a7;font-size:18px;font-weight:900;letter-spacing:.08em}.panelLabel{font-size:11px;color:#c8b39a;margin-bottom:2px}.panelRow button{min-height:37px;background:linear-gradient(#76604b,#4a3b2e);border:1px solid #9a7d5f;color:#fff0d8;border-radius:8px;font-size:11px;box-shadow:0 2px #0b0806}
.panelControls{display:grid;grid-template-columns:1fr 86px;gap:8px;margin-top:10px}.panelControls button{min-height:45px}.panelVerify{background:linear-gradient(#8a3e31,#5e261f)!important;color:#fff4df!important;border-color:#b4604d!important;letter-spacing:.1em}.panelStatus{margin-top:8px;height:23px;text-align:center;font-size:11px;color:#bca88e}.panelStatus.good{color:#a9d69b}.panelStatus.bad{color:#f09b8f}

/* picker */
.bigValue{height:70px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:42px;font-weight:900;letter-spacing:.10em;background:#251b14;color:#ffd98e;border:2px inset #8e704c;border-radius:10px;text-shadow:0 0 12px rgba(255,203,110,.25)}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.stepper button{font-size:23px}
.choice.selected{background:linear-gradient(#6c4429,#3e2618);color:#fff3da;box-shadow:inset 0 0 0 2px #d0a45f}

/* route */
.routeDots{height:34px;display:flex;gap:7px;justify-content:center;align-items:center;margin:7px 0}.routeDot{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2c2119;color:#e8c88d;border:1px solid #6d543d;font-weight:900}.routeDot.empty{color:#705c48;background:#17120e}

/* title */
#titleLayer{position:absolute;inset:0;z-index:70}.titleHot{position:absolute;left:18%;width:64%;height:7.8%;background:transparent;border-radius:12px}.titleHot:active{background:rgba(255,223,166,.07)}.titleNew{top:66.0%}.titleContinue{top:74.0%}.titleContinue.disabled{pointer-events:none}.titleContinue.disabled:after{content:"SAVEなし";position:absolute;right:-3px;top:50%;transform:translateY(-50%);padding:3px 6px;border-radius:999px;background:rgba(30,18,12,.78);border:1px solid rgba(255,255,255,.18);font-size:9px;color:#d7c7af}
#versionTag{position:absolute;z-index:72;left:50%;bottom:calc(var(--safeBottom) + 9px);transform:translateX(-50%);font-size:9px;letter-spacing:.08em;color:rgba(255,238,210,.58);text-shadow:0 1px 3px #000;pointer-events:none}

/* transitions, cinematic, toast, ripple */
#fade{position:absolute;inset:0;z-index:92;pointer-events:none;background:#030201;opacity:0;transition:opacity .20s ease}.fadein{opacity:1!important}
#cinematic{position:absolute;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:35px;background:#050302;color:#f3e9dc;text-align:center;font-family:serif;font-size:19px;line-height:1.8;letter-spacing:.08em}.cinText{animation:cinIn .35s ease-out}@keyframes cinIn{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
#toast{position:absolute;z-index:84;left:50%;top:calc(var(--safeTop) + 48px);transform:translate(-50%,-8px);max-width:88%;padding:9px 14px;border-radius:999px;background:rgba(25,15,10,.93);border:1px solid rgba(213,169,101,.62);box-shadow:0 8px 25px #000a;color:#fff0d8;font-size:12px;text-align:center;opacity:0;transition:.22s;pointer-events:none}.showtoast{opacity:1!important;transform:translate(-50%,0)!important}
#itemFlash{position:absolute;z-index:83;left:50%;top:43%;transform:translate(-50%,-50%) scale(.86);min-width:220px;padding:18px 20px;border-radius:18px;text-align:center;background:linear-gradient(180deg,rgba(56,35,21,.96),rgba(21,13,9,.97));border:1px solid #d0a15e;box-shadow:0 0 0 1px #3a2417,0 15px 44px #000d;color:#fff0d6;opacity:0;pointer-events:none}.itemFlashOn{animation:itemPop 1.15s ease both}@keyframes itemPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.78)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}
#rippleLayer{position:absolute;inset:0;z-index:89;pointer-events:none}.tapRipple{position:absolute;width:18px;height:18px;margin:-9px;border:1px solid rgba(255,226,174,.8);border-radius:50%;animation:ripple .45s ease-out forwards}@keyframes ripple{to{opacity:0;transform:scale(3.2)}}
#endingBtn{position:absolute;z-index:74;left:20%;right:20%;bottom:calc(var(--safeBottom) + 48px);height:48px;border-radius:14px;border:1px solid #ddbd82;background:rgba(43,26,16,.91);color:#fff0d5;font-weight:900;display:none;box-shadow:0 8px 25px #0009}

@media (max-height:700px){.card{padding:13px}.card h2{font-size:18px}.card p{font-size:12px;margin:5px 0 7px}.panelRow{min-height:49px;padding:5px}.panelControls button{min-height:40px}.inspectCard{height:94%}.invItem{min-height:66px}.navbtn{height:38px}#dock{height:49px}}
</style>
</head>
<body>
<div id="app">
  <img id="bg" class="bg" alt="ゲーム背景" />
  <div id="sceneFx"></div>
  <div id="sceneTitle"></div>
  <div id="hotspots"></div>

  <div id="dock">
    <button id="backBtn" class="navbtn" type="button"><span class="ni">←</span><span>戻る</span></button>
    <button id="bagBtn" class="navbtn" type="button"><span class="ni">▣</span><span>持ち物</span></button>
    <button id="hintBtn" class="navbtn" type="button"><span class="ni">✦</span><span>ヒント</span></button>
  </div>

  <div id="dialog"></div>
  <div id="titleLayer">
    <button class="titleHot titleNew" aria-label="はじめから"></button>
    <button class="titleHot titleContinue" aria-label="つづきから"></button>
  </div>
  <div id="versionTag">COPA GAMES · v0.3 IMMERSION</div>

  <div id="overlay" class="overlay"><div class="card" id="overlayCard"></div></div>
  <button id="endingBtn" type="button">タイトルへ戻る</button>
  <div id="toast"></div>
  <div id="itemFlash"></div>
  <div id="rippleLayer"></div>
  <div id="cinematic"><div class="cinText" id="cinText"></div></div>
  <div id="fade"></div>
</div>
<script>
(()=>{
'use strict';
const VERSION='0.3.0';
const SAVE_KEY='copa_sento_save';
const A='';
const imgs={
 title:'銭湯からの脱出_夜の番台.png',hub:'夜の銭湯_静かな脱衣所.png',locker:'湯屋の木製ロッカー14番.png',
 entrance:'夕暮れの銭湯玄関と下足箱.png',counterFront:'夜の銭湯番台と静かな入口.png',counter:'銭湯の番台裏と従業員専用通路.png',
 keys:'銭湯の脱衣鍵返却所.png',bath:'富士山銭湯の四つの湯槽.png',bathDetail:'銭湯の浴槽設定案内板.png',
 sauna:'静寂の和風サウナ_интерьер.png',saunaDetail:'木製サウナの温もりとタイマー.png',rest:'夜の銭湯休憩室と牛乳瓶棚.png',restDetail:'湯上がり牛乳びん返却所.png',
 panel:'銭湯の閉店点検表.png',route:'銭湯の閉店巡回図.png',evac:'銭湯ロビーの避難経路図.png',corridor:'銭湯の静かな裏通路.png',backdoor:'銭湯裏口の夜道.png',openDoor:'夜の銭湯裏口とつながったスマホ.png',end:'銭湯の脱出成功_月夜の帰り道.png'
};
const fresh=()=>({
 version:VERSION,scene:'hub',history:[],inventory:['ロッカーキー14'],lockerOpened:false,shoeBoxOpened:false,shoehorn:false,gateOpen:false,counterSeen:false,
 clues:{locker:false,bath:false,sauna:false,rest:false},panel:{locker:0,bath:'water',sauna:'up',rest:'white',verified:false,opened:false,seq:[]},
 backdoorKey:false,escaped:false,visited:{},hintCount:0
});
let s=fresh(),dialogQueue=[],dialogResolve=null,transitioning=false,toastTimer=null,audioCtx=null;
const $=q=>document.querySelector(q),app=$('#app'),bg=$('#bg'),hot=$('#hotspots'),overlay=$('#overlay'),card=$('#overlayCard'),dialog=$('#dialog'),fade=$('#fade'),titleLayer=$('#titleLayer'),sceneTitle=$('#sceneTitle'),endingBtn=$('#endingBtn'),dock=$('#dock'),cinematic=$('#cinematic'),cinText=$('#cinText');

/* tiny synthesized SFX: no extra audio files */
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function tone(freq=440,dur=.05,type='sine',vol=.035,delay=0){try{ensureAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}catch{}}
function sfx(name){if(name==='tap')tone(360,.035,'sine',.016);if(name==='item'){tone(520,.10,'sine',.035);tone(780,.16,'sine',.025,.07)}if(name==='unlock'){tone(170,.055,'square',.024);tone(260,.07,'square',.022,.08)}if(name==='error'){tone(145,.10,'sawtooth',.022);tone(116,.12,'sawtooth',.018,.08)}if(name==='ok'){tone(440,.08,'sine',.026);tone(660,.13,'sine',.03,.08)}if(name==='final'){tone(330,.10,'sine',.03);tone(495,.16,'sine',.03,.10);tone(740,.25,'sine',.026,.23)}}
function buzz(ms=20){try{navigator.vibrate?.(ms)}catch{}}

function save(){s.version=VERSION;localStorage.setItem(SAVE_KEY,JSON.stringify(s));updateContinue()}
function migrate(d){const f=fresh();if(!d||typeof d!=='object')return f;const out={...f,...d};out.inventory=Array.isArray(d.inventory)?d.inventory:f.inventory;out.history=Array.isArray(d.history)?d.history:[];out.clues={...f.clues,...(d.clues||{})};out.panel={...f.panel,...(d.panel||{})};out.visited={...(d.visited||{})};if(typeof out.shoeBoxOpened!=='boolean')out.shoeBoxOpened=!!out.shoehorn;return out}
function load(){try{s=migrate(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{s=fresh()}}
function updateContinue(){const b=$('.titleContinue');b.classList.toggle('disabled',!localStorage.getItem(SAVE_KEY))}
function preload(){Object.values(imgs).forEach((src,i)=>setTimeout(()=>{const im=new Image();im.src=A+src},i*35))}
function toast(t,bad=false){clearTimeout(toastTimer);const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'rgba(214,99,83,.72)':'rgba(213,169,101,.62)';e.classList.add('showtoast');toastTimer=setTimeout(()=>e.classList.remove('showtoast'),1500)}
function itemFlash(name){const map={'靴箱の鍵':'🗝️','スマホ':'📱','財布':'👛','靴べら':'🥄','裏口の鍵':'🔑'};const e=$('#itemFlash');e.innerHTML=`<div style="font-size:34px;margin-bottom:5px">${map[name]||'✦'}</div><div style="font-size:11px;opacity:.72">ITEM GET</div><b>${name}</b>`;e.classList.remove('itemFlashOn');void e.offsetWidth;e.classList.add('itemFlashOn');sfx('item')}
function addItem(name,flash=true){if(!s.inventory.includes(name)){s.inventory.push(name);save();if(flash)itemFlash(name)}}

function setBg(name){const src=A+imgs[name];if(bg.getAttribute('src')===src)return;bg.src=src}
function hs(x,y,w,h,fn,label='調べる'){const b=document.createElement('button');b.type='button';b.className='hotspot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',label);b.innerHTML='<span class="spark"></span>';b.addEventListener('click',e=>{e.stopPropagation();sfx('tap');fn()});hot.appendChild(b)}
function tapRipple(x,y){const r=document.createElement('span');r.className='tapRipple';r.style.left=x+'px';r.style.top=y+'px';$('#rippleLayer').appendChild(r);setTimeout(()=>r.remove(),500)}
app.addEventListener('pointerdown',e=>{ensureAudio();if(e.target.closest('button'))tapRipple(e.clientX-app.getBoundingClientRect().left,e.clientY-app.getBoundingClientRect().top)},{passive:true});

function say(...lines){return new Promise(res=>{dialogQueue=[...lines];dialogResolve=res;nextDialog()})}
function nextDialog(){if(!dialogQueue.length){dialog.classList.remove('open');const r=dialogResolve;dialogResolve=null;if(r)r();return}dialog.textContent=dialogQueue.shift();dialog.classList.add('open')}
dialog.addEventListener('click',()=>{sfx('tap');nextDialog()});

function closeOverlay(){overlay.classList.remove('open');card.className='card';card.innerHTML=''}
function openOverlay(html,init,cls=''){card.className='card '+cls;card.innerHTML=html;overlay.classList.add('open');if(init)init()}
overlay.addEventListener('click',e=>{if(e.target===overlay){sfx('tap');closeOverlay()}});

async function transitionTo(name,push=true){if(transitioning||s.scene===name)return;transitioning=true;if(push&&s.scene&&s.scene!=='title')s.history.push(s.scene);fade.classList.add('fadein');await wait(150);s.scene=name;save();render();await wait(80);fade.classList.remove('fadein');transitioning=false}
function go(name,push=true){transitionTo(name,push)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function back(){if(dialog.classList.contains('open')){nextDialog();return}if(overlay.classList.contains('open')){closeOverlay();return}const p=s.history.pop();if(p){s.scene=p;save();render()}else if(s.scene!=='hub')go('hub',false)}

function details(title,img,text,after){openOverlay(`<button class="closeX" id="closeDetail" aria-label="閉じる">×</button><div class="inspectMedia"><img src="${A+img}" alt="${title}"></div><div class="inspectText"><b>${title}</b><br>${text||''}</div><div class="inspectActions"><button id="inspectBack">戻る</button></div>`,()=>{const done=()=>{closeOverlay();if(after)after()};$('#closeDetail').onclick=done;$('#inspectBack').onclick=done},'inspectCard')}
function inventory(){const icon={'ロッカーキー14':'🔑','靴箱の鍵':'🗝️','スマホ':'📱','財布':'👛','靴べら':'🥄','裏口の鍵':'🔑'};const desc={'ロッカーキー14':'腕につけていた鍵。','靴箱の鍵':'自分の靴箱の鍵。','スマホ':s.escaped?'普通に電源が入っている。':'なぜか電源が入らない。','財布':'中身はそのままだ。','靴べら':'長くて丈夫な木製。','裏口の鍵':'点検盤から出てきた鍵。'};openOverlay(`<h2>持ち物</h2><div class="invGrid">${s.inventory.map(n=>`<div class="invItem"><div class="invIcon">${icon[n]||'•'}</div><div><div class="invName">${n}</div><div class="invDesc">${desc[n]||''}</div></div></div>`).join('')}</div><div class="row"><button id="closeBag" class="primary">閉じる</button></div>`,()=>$('#closeBag').onclick=closeOverlay)}
function hint(){s.hintCount=(s.hintCount||0)+1;save();const h={hub:'ロッカー・浴場・休憩所・番台付近を調べられます。まず14番ロッカーが自然です。',locker:'14番の中をタップして、帰るための持ち物を確認してください。',entrance:s.shoehorn?'番台の小扉。靴べらの長さなら向こう側の掛け金に届きそうです。':'先に自分の靴箱を確認してください。長くて使えそうな物も近くにあります。',counter:'鍵返却所・閉店点検盤・避難経路図・巡回図を調べられます。',bath:'設定温度と現在温度の「差」が一番大きい浴槽を探します。',sauna:'「6分」を12分計の針の位置に置き換えます。',rest:'返却された瓶の本数を比べ、一番少ない種類を見ます。',corridor:'裏口の鍵があれば、正面の扉を開けられます。'}[s.scene]||'光る場所を調べてみてください。';say(h);app.classList.add('show-hints');setTimeout(()=>app.classList.remove('show-hints'),3300)}

function render(){hot.innerHTML='';endingBtn.style.display='none';const isTitle=s.scene==='title',isEnd=s.scene==='end';dock.style.display=(isTitle||isEnd)?'none':'flex';sceneTitle.style.display=(isTitle||isEnd)?'none':'block';const R=scenes[s.scene]||scenes.hub;setBg(R.bg);sceneTitle.textContent=R.title||'';R.hotspots?.();if(!isTitle&&!isEnd){const first=!s.visited[s.scene];s.visited[s.scene]=(s.visited[s.scene]||0)+1;save();if(first){app.classList.remove('scene-pulse');void app.offsetWidth;app.classList.add('scene-pulse');setTimeout(()=>app.classList.remove('scene-pulse'),1750)}}}

const scenes={
 title:{bg:'title',title:'',hotspots:()=>{}},
 hub:{bg:'hub',title:'脱衣所',hotspots:()=>{
  hs(0,8,31,55,()=>go('locker'),'ロッカー');
  hs(29,18,26,31,()=>go('bath'),'浴場');
  hs(59,18,31,36,()=>go('rest'),'休憩所');
  hs(38,20,27,34,()=>go('entrance'),'番台・入口');
  hs(61,4,24,16,()=>say('壁時計だ。','……針が動いていないように見える。','秒針の音もしない。'),'時計');
 }},
 locker:{bg:'locker',title:'ロッカー 14',hotspots:()=>{hs(6,15,88,60,async()=>{if(!s.lockerOpened){s.lockerOpened=true;save();sfx('unlock');buzz(25);await say('14番ロッカーを開けた。','服。財布。スマホ。それと靴箱の鍵。');addItem('靴箱の鍵',false);addItem('スマホ',false);addItem('財布',false);itemFlash('スマホ');await wait(520);await say('スマホの電源ボタンを長押しする。','……何も起きない。','充電が切れていた覚えはないんだけど。')}else say('必要な物は回収した。','スマホはまだ電源が入らない。')},'14番ロッカー');}},
 entrance:{bg:'entrance',title:'入口・下足箱',hotspots:()=>{
  hs(0,6,53,66,async()=>{if(!s.inventory.includes('靴箱の鍵')){await say('自分の靴箱を開けたいが、鍵がない。','脱衣所のロッカーに入れたはずだ。');return}if(!s.shoeBoxOpened){s.shoeBoxOpened=true;save();sfx('unlock');await say('靴箱の鍵で自分の下足箱を開けた。','靴はちゃんと残っている。','横には、備え付けの長い木製靴べらが掛かっている。');s.shoehorn=true;addItem('靴べら');await say('この長さなら……何かに届かせられるかもしれない。')}else say('自分の靴は残っている。')},'下足箱');
  hs(54,24,42,50,async()=>{if(!s.gateOpen){if(s.shoehorn){await say('番台の小扉は、向こう側の掛け金で止まっている。','靴べらを隙間から差し込んで……。');sfx('unlock');buzz(35);s.gateOpen=true;s.counterSeen=true;save();await say('……カチャン。','掛け金が外れた。');go('counter')}else await say('番台の小扉は向こう側から掛かっている。','手では届かない。','細くて長い物があれば……。')}else go('counter')},'番台の小扉');
  hs(51,0,49,23,()=>say('正面入口は閉まっている。','開閉ボタンも反応しない。','手で動かそうとしても、ロックされている。'),'正面入口');
 }},
 counter:{bg:'counter',title:'番台の内側',hotspots:()=>{
  hs(4,17,39,40,()=>keyPuzzle(),'ロッカーキー返却所');
  hs(40,22,35,39,()=>panelPuzzle(),'閉店点検盤');
  hs(68,8,30,34,()=>details('避難経路図',imgs.evac,'正面入口が使えない場合、番台奥の従業員通路から裏口へ出られる。'),'避難経路図');
  hs(68,46,29,24,()=>details('閉店巡回図',imgs.route,'閉店時の巡回順は「浴場 → サウナ → 脱衣所 → 休憩所」。'),'閉店巡回図');
  hs(57,55,40,34,async()=>{if(s.backdoorKey){await say('裏口の鍵は手に入れた。','従業員通路へ進もう。');go('corridor')}else say('従業員用の通路だ。','避難経路図では、この先が裏口につながっていた。','ただ、裏口の鍵がない。')},'従業員通路');
 }},
 bath:{bg:'bath',title:'浴場',hotspots:()=>{
  hs(13,26,73,47,()=>bathPuzzle(),'浴槽');
  hs(3,3,94,23,()=>details('浴槽設定状況',imgs.bathDetail,'設定温度と現在温度が書かれている。数字の差を比べられそうだ。'),'温度案内');
  hs(67,0,31,16,()=>go('sauna'),'サウナ');
 }},
 sauna:{bg:'sauna',title:'サウナ',hotspots:()=>{
  hs(52,4,44,36,()=>saunaPuzzle(),'12分計');
  hs(12,6,39,34,()=>details('サウナ利用案内',imgs.saunaDetail,'「1回6分程度」が目安と書かれている。'),'利用案内');
 }},
 rest:{bg:'rest',title:'休憩所',hotspots:()=>{hs(0,20,40,49,()=>restPuzzle(),'牛乳びん返却口');hs(52,8,43,61,()=>restPuzzle(),'返却瓶');}},
 corridor:{bg:'backdoor',title:'従業員通路・裏口',hotspots:()=>{hs(24,13,54,62,async()=>{if(!s.backdoorKey){await say('裏口だ。','鍵がかかっている。');return}await say('「裏口」の鍵を差し込む。');sfx('unlock');buzz(40);await wait(300);await say('……ガチャ。');fade.classList.add('fadein');await wait(180);setBg('openDoor');fade.classList.remove('fadein');await wait(700);sfx('final');await say('外の車の音。人の声。','……さっきまで、あんなに静かだったのに。','ポケットのスマホが震えた。');await say('電源が……入ってる。','時計も普通に進んでいる。','……なんだったんだ？');s.escaped=true;save();s.scene='end';render()},'裏口');}},
 end:{bg:'end',title:'',hotspots:()=>{endingBtn.style.display='block';sceneTitle.style.display='none';dock.style.display='none'}}
};

async function keyPuzzle(){details('脱衣鍵返却所',imgs.keys,'返却されていない鍵は 08・14・23・31。14は自分が持っている。',()=>openKeyQuestion())}
function openKeyQuestion(){openOverlay(`<h2>脱衣所の点検</h2><p>返却ボードとロッカー側を照合する。<br>08と31はロッカー側に鍵があり、14は自分が使用中。<br><b>説明がつかない番号は？</b></p><div class="grid2"><button data-v="8">08</button><button data-v="23">23</button><button data-v="31">31</button><button data-v="14">14</button></div><div class="sep"></div><div class="row"><button id="viewKeys">返却所を見る</button><button id="kc">戻る</button></div>`,()=>{card.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{if(+b.dataset.v===23){s.clues.locker=true;save();sfx('ok');buzz(20);closeOverlay();await say('23番だけ状況が合わない。','脱衣所の確認値は「23」。')}else{sfx('error');toast('その番号では説明がつくようだ',true)}});$('#viewKeys').onclick=()=>details('脱衣鍵返却所',imgs.keys,'08・14・23・31の位置が空いている。',openKeyQuestion);$('#kc').onclick=closeOverlay})}
function bathPuzzle(){details('浴槽設定状況',imgs.bathDetail,'水風呂 18→17、炭酸泉 38→38、薬湯 40→39、主浴槽 41→43。',()=>openBathQuestion())}
function openBathQuestion(){openOverlay(`<h2>浴場の点検</h2><p>設定温度と現在温度の差が<br><b>最も大きい浴槽</b>を選ぶ。</p><div class="grid2"><button data-b="water">水風呂</button><button data-b="carbon">炭酸泉</button><button data-b="herb">薬湯</button><button data-b="main">主浴槽</button></div><div class="sep"></div><div class="row"><button id="viewBath">表を見る</button><button id="bc">戻る</button></div>`,()=>{card.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{if(b.dataset.b==='main'){s.clues.bath=true;save();sfx('ok');closeOverlay();await say('主浴槽だけ差が2℃。','浴場の確認は「主浴槽」。')}else{sfx('error');toast('温度差をもう一度比べよう',true)}});$('#viewBath').onclick=()=>details('浴槽設定状況',imgs.bathDetail,'設定と現在の温度差を比べる。',openBathQuestion);$('#bc').onclick=closeOverlay})}
function saunaPuzzle(){details('サウナ利用案内',imgs.saunaDetail,'目安は「1回6分程度」。12分計で6分の位置を考える。',()=>openSaunaQuestion())}
function openSaunaQuestion(){openOverlay(`<h2>サウナの点検</h2><p>12分計のスタートは真上。<br><b>6分の位置</b>はどの方向？</p><div class="grid2"><button data-s="up">↑ 上</button><button data-s="right">→ 右</button><button data-s="down">↓ 下</button><button data-s="left">← 左</button></div><div class="sep"></div><div class="row"><button id="viewSauna">案内を見る</button><button id="sc">戻る</button></div>`,()=>{card.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{if(b.dataset.s==='down'){s.clues.sauna=true;save();sfx('ok');closeOverlay();await say('12分の半分、6分。','位置は真下。「↓」だ。')}else{sfx('error');toast('12分の半分の位置を考えよう',true)}});$('#viewSauna').onclick=()=>details('サウナ利用案内',imgs.saunaDetail,'1回6分程度が目安。',openSaunaQuestion);$('#sc').onclick=closeOverlay})}
function restPuzzle(){details('牛乳びん返却口',imgs.restDetail,'白4本、茶2本、黄3本、桃5本。',()=>openRestQuestion())}
function openRestQuestion(){openOverlay(`<h2>休憩所の点検</h2><p>返却された本数が<br><b>最も少ない種類の色</b>を選ぶ。</p><div class="grid2"><button data-r="white">白</button><button data-r="brown">茶</button><button data-r="yellow">黄</button><button data-r="pink">桃</button></div><div class="sep"></div><div class="row"><button id="viewRest">返却口を見る</button><button id="rc">戻る</button></div>`,()=>{card.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(b.dataset.r==='brown'){s.clues.rest=true;save();sfx('ok');closeOverlay();await say('一番少ないのは2本。','休憩所の確認色は「茶」。')}else{sfx('error');toast('本数を数え直そう',true)}});$('#viewRest').onclick=()=>details('牛乳びん返却口',imgs.restDetail,'白4・茶2・黄3・桃5。',openRestQuestion);$('#rc').onclick=closeOverlay})}

function panelPuzzle(){const bathLabel={water:'水風呂',carbon:'炭酸泉',herb:'薬湯',main:'主浴槽'}[s.panel.bath],saunaLabel={up:'↑',right:'→',down:'↓',left:'←'}[s.panel.sauna],restLabel={white:'白',brown:'茶',yellow:'黄',pink:'桃'}[s.panel.rest],solved=Object.values(s.clues).filter(Boolean).length;
 openOverlay(`<div class="panelHeader">閉店点検盤</div><div class="panelSub">CLOSING INSPECTION · 確認済み ${solved}/4</div><div class="panelRows">
 <div class="panelRow"><div class="lamp ${s.clues.locker?'on':''}"></div><div><div class="panelLabel">脱衣所</div><div class="panelValue">${String(s.panel.locker).padStart(2,'0')}</div></div><button id="lockerSet">変更</button></div>
 <div class="panelRow"><div class="lamp ${s.clues.bath?'on':''}"></div><div><div class="panelLabel">浴場</div><div class="panelValue" style="font-size:14px">${bathLabel}</div></div><button id="bathSet">変更</button></div>
 <div class="panelRow"><div class="lamp ${s.clues.sauna?'on':''}"></div><div><div class="panelLabel">サウナ</div><div class="panelValue">${saunaLabel}</div></div><button id="saunaSet">変更</button></div>
 <div class="panelRow"><div class="lamp ${s.clues.rest?'on':''}"></div><div><div class="panelLabel">休憩所</div><div class="panelValue">${restLabel}</div></div><button id="restSet">変更</button></div>
 </div><div class="panelControls"><button id="verify" class="panelVerify">閉 店 確 認</button><button id="panelClose">戻る</button></div><div class="panelStatus" id="panelMsg">各場所の点検情報を入力してください</div>`,()=>{$('#lockerSet').onclick=numberPicker;$('#bathSet').onclick=()=>pick('浴場',['water','carbon','herb','main'],['水風呂','炭酸泉','薬湯','主浴槽'],'bath');$('#saunaSet').onclick=()=>pick('サウナ',['up','right','down','left'],['↑ 上','→ 右','↓ 下','← 左'],'sauna');$('#restSet').onclick=()=>pick('休憩所',['white','brown','yellow','pink'],['白','茶','黄','桃'],'rest');$('#panelClose').onclick=closeOverlay;$('#verify').onclick=verifyPanel},'panelCard')}
function numberPicker(){let n=s.panel.locker;openOverlay(`<h2>脱衣所</h2><p style="text-align:center">返却状況から得た番号を入力</p><div class="bigValue" id="num">${String(n).padStart(2,'0')}</div><div class="stepper"><button id="minus">−</button><button id="plus">＋</button></div><div class="sep"></div><div class="row"><button id="numok" class="primary">決定</button><button id="numback">戻る</button></div>`,()=>{const u=()=>$('#num').textContent=String(n).padStart(2,'0');$('#minus').onclick=()=>{n=(n+39)%40;u();sfx('tap')};$('#plus').onclick=()=>{n=(n+1)%40;u();sfx('tap')};$('#numok').onclick=()=>{s.panel.locker=n;save();closeOverlay();panelPuzzle()};$('#numback').onclick=()=>{closeOverlay();panelPuzzle()}})}
function pick(title,vals,labels,key){openOverlay(`<h2>${title}</h2><p style="text-align:center">点検値を選択</p><div class="grid2">${vals.map((v,i)=>`<button class="choice ${s.panel[key]===v?'selected':''}" data-p="${v}">${labels[i]}</button>`).join('')}</div><div class="sep"></div><button id="pickback" style="width:100%">戻る</button>`,()=>{card.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.panel[key]=b.dataset.p;save();closeOverlay();panelPuzzle()});$('#pickback').onclick=()=>{closeOverlay();panelPuzzle()}})}
function verifyPanel(){const msg=$('#panelMsg');if(!Object.values(s.clues).every(Boolean)){sfx('error');msg.textContent='まだ確認していない場所があります';msg.className='panelStatus bad';return}const ok=s.panel.locker===23&&s.panel.bath==='main'&&s.panel.sauna==='down'&&s.panel.rest==='brown';if(!ok){sfx('error');buzz(25);msg.textContent='ERROR：どこかの入力が違います';msg.className='panelStatus bad';return}s.panel.verified=true;save();sfx('ok');msg.textContent='OK：点検値一致';msg.className='panelStatus good';setTimeout(routeSequence,520)}
function routeSequence(){let seq=[];const target=['bath','sauna','locker','rest'],lab={bath:'浴',sauna:'サ',locker:'脱',rest:'休'};openOverlay(`<h2>最終巡回</h2><p>点検値は一致した。<br>閉店巡回図に書かれた順番で4エリアを押す。</p><div class="routeDots" id="seq"></div><div class="grid2"><button data-q="bath">浴場</button><button data-q="sauna">サウナ</button><button data-q="locker">脱衣所</button><button data-q="rest">休憩所</button></div><div class="sep"></div><div class="row"><button id="routeView">巡回図を見る</button><button id="routeBack">戻る</button></div>`,()=>{const draw=()=>$('#seq').innerHTML=[0,1,2,3].map(i=>seq[i]?`<span class="routeDot">${lab[seq[i]]}</span>`:`<span class="routeDot empty">·</span>`).join('');draw();card.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{seq.push(b.dataset.q);draw();const i=seq.length-1;if(seq[i]!==target[i]){sfx('error');buzz(20);seq=[];draw();toast('巡回順が違う',true);return}if(seq.length===4){s.panel.opened=true;s.backdoorKey=true;save();sfx('final');buzz(45);closeOverlay();await say('カチ……。','カチ……。','……ガコン。');await say('点検盤の下部が開いた。');addItem('裏口の鍵');await say('「裏口」と書かれた鍵だ。')}});$('#routeView').onclick=()=>details('閉店巡回図',imgs.route,'浴場 → サウナ → 脱衣所 → 休憩所',routeSequence);$('#routeBack').onclick=()=>{closeOverlay();panelPuzzle()}})}

async function cinematicLines(lines){cinematic.style.display='flex';let i=0;return new Promise(resolve=>{const show=()=>{cinText.classList.remove('cinText');void cinText.offsetWidth;cinText.classList.add('cinText');cinText.textContent=lines[i]};show();const advance=()=>{sfx('tap');i++;if(i>=lines.length){cinematic.removeEventListener('click',advance);cinematic.style.display='none';resolve();return}show()};cinematic.addEventListener('click',advance)})}
async function newGame(){ensureAudio();s=fresh();localStorage.removeItem(SAVE_KEY);save();titleLayer.style.display='none';$('#versionTag').style.display='none';fade.classList.add('fadein');await wait(150);await cinematicLines(['……暑い。','少し、休んでから帰ろう。','…………。','……ん？']);s.scene='hub';render();fade.classList.remove('fadein');await wait(300);await say('……誰もいない？','さっきまで人の声がしてたのに。','外も……妙に静かだ。');$('#hintBtn').classList.add('attn');setTimeout(()=>$('#hintBtn').classList.remove('attn'),3000)}
function continueGame(){ensureAudio();load();titleLayer.style.display='none';$('#versionTag').style.display='none';if(s.scene==='title'||!scenes[s.scene])s.scene='hub';render();toast('つづきから再開しました')}
function showTitle(){s.scene='title';titleLayer.style.display='block';$('#versionTag').style.display='block';setBg('title');hot.innerHTML='';sceneTitle.style.display='none';dock.style.display='none';endingBtn.style.display='none';updateContinue()}

$('.titleNew').onclick=newGame;
$('.titleContinue').onclick=()=>{if(localStorage.getItem(SAVE_KEY))continueGame()};
$('#backBtn').onclick=()=>{sfx('tap');back()};
$('#bagBtn').onclick=()=>{sfx('tap');inventory()};
$('#hintBtn').onclick=()=>{sfx('tap');hint()};
endingBtn.onclick=()=>{sfx('tap');localStorage.removeItem(SAVE_KEY);s=fresh();showTitle()};

preload();updateContinue();showTitle();
})();
</script>
</body>
</html>
